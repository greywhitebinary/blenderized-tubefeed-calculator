<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feed. Form. Flow. calculator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- The Feed. Form. Flow. mark with claret in front, used as the browser-tab
       icon for both calculators; the website's own mark has blue in front.
       The same file lives in ENCalc and BTF-Calc; keep the two copies equal.
       See the Feed. Form. Flow. visual identity guide. -->
  <style>
    .fff-claret { fill: #A4243A; }
    .fff-gold { fill: #D9A62E; }
    .fff-panel { fill: #245B78; }
    .fff-mark { fill: #FAFAFA; }
    .fff-wave { stroke: #FAFAFA; }
    /* Dark tab bars: the front stays standard claret because the white marks
       need it (7.3:1; on the lifted claret they would be 3.1:1). The blue back
       layer lifts to #76B8DA (7.4:1 on #202124). Mustard stays. */
    @media (prefers-color-scheme: dark) {
      .fff-panel { fill: #76B8DA; }
      .fff-mark { fill: #FFFFFF; }
      .fff-wave { stroke: #FFFFFF; }
    }
  </style>
  <g transform="rotate(1.2 32 32)">
    <rect class="fff-panel" x="10" y="10" width="51" height="51" rx="8"/>
  </g>
  <g transform="rotate(0.4 32 32)">
    <rect class="fff-gold" x="6.5" y="6.5" width="51" height="51" rx="8"/>
  </g>
  <g transform="rotate(-1.5 28.5 28.5)">
    <rect class="fff-claret" x="3" y="3" width="51" height="51" rx="8.2"/>
    <g transform="translate(-0.64 -0.64) scale(0.9107)">
      <path class="fff-wave" d="M16 30c5-9 11-9 16 0s11 9 16 0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <circle class="fff-mark" cx="20" cy="44" r="4.5"/>
      <circle class="fff-mark" cx="32" cy="44" r="4.5"/>
      <circle class="fff-gold" cx="44" cy="44" r="4.5"/>
    </g>
  </g>
</svg>
