name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # workflow_dispatch + schedule exist for the verify-backend job below, NOT
  # the fast test job (which only needs push/pull_request). Splitting a slow
  # job into its own trigger, in the same workflow file, is done with a
  # per-job `if:` on the event name - see that job.
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC. Not tied to pushes - see the verify-backend
    # job's comment for why.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Test + lint (fast)
    # Only for the events this job actually needs; workflow_dispatch/schedule
    # runs are for verify-backend, not this job.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Streamlit Community Cloud (3.14.6) and the local .venv
          # (3.14.x) - see CONTEXT.md §11 and pyproject.toml.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      # --- Lint steps: NON-BLOCKING for now (continue-on-error) ---
      # src/, app/, and scripts/ (~5,600 lines) have never been run through
      # black/ruff, and that mechanical reformat has NOT been approved by
      # the author yet (it's a real diff, not a no-op). Failing CI on day
      # one for pre-existing style would be noise, not signal for this repo.
      # The author decides on the reformat separately; once it lands, drop
      # continue-on-error from both steps below so lint actually gates CI.
      - name: Run ruff check (non-blocking)
        run: ruff check .
        continue-on-error: true

      - name: Run black --check (non-blocking)
        run: black --check .
        continue-on-error: true

  verify-backend:
    name: Verify backend (slow - full CNF data parse)
    # NOT run on every push/PR: verify_backend.py parses the full ~565k-row
    # Nutrient_Amount.csv (the committed CNF data - 13 tracked files under
    # cnf_fcen_all-files-data_2026/, whole repo history ~14 MB, so a runner
    # can check it out and run this directly), which is slow enough that it
    # doesn't belong gating every push. Runs on manual dispatch and on a
    # weekly schedule instead.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run verify_backend.py
        run: python scripts/verify_backend.py

  # No deploy job here on purpose: Streamlit Community Cloud already
  # auto-deploys from `main` on every push (see CONTEXT.md §3/§11).
