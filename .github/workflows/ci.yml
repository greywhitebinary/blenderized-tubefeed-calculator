name: CI

# WHAT THIS GUARDS
#
# This repo has already been bitten by the thing this file exists to stop:
# scripts/check_tab_restructure.py sat broken on `main` for a week and
# nobody noticed, because nothing ran it (CONTEXT.md §9, 2026-07-23). The
# first version of this workflow fixed that for pytest and left the same
# hole open for every other check -- they ran only when a human remembered
# to type them.
#
# So every check the project has now runs here, on every push. A check
# that only runs when someone remembers is not a check; it is a habit.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC. Nothing in the repo changes on a Monday --
    # this catches the world changing underneath it. requirements.txt pins
    # streamlit exactly but lets pandas float, and a floating dependency
    # is exactly how the Streamlit 1.60 deploy broke (CONTEXT.md §11).
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Tests, checks and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches Streamlit Community Cloud (3.14.6) and the local .venv
          # (3.14.x) - see CONTEXT.md §11 and pyproject.toml.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      # --- The nine verification checks ---------------------------------
      # Unit tests can't see the app. These can: six of the nine drive the
      # real Streamlit UI (AppTest), and the others parse the real 565k-row
      # CNF data -- which is where this project's actual regressions have
      # happened.
      #
      # They were previously run by hand. Every one finishes in under two
      # seconds -- including verify_backend.py, whose "too slow to gate a
      # push" note turned out to be wrong when measured (0.53s from a cold
      # checkout with no Parquet cache). There was never a reason to leave
      # them out.

      - name: Backend modules (src/ against real CNF)
        run: python scripts/verify_backend.py

      - name: App imports
        run: python scripts/check_app_imports.py

      - name: Hand-traced calculation cross-check
        run: python scripts/trace_calculation.py

      - name: AppTest - tab structure
        run: python scripts/check_tab_restructure.py

      - name: AppTest - recipe record save/load
        run: python scripts/check_recipe_record.py

      - name: AppTest - food search
        run: python scripts/check_food_search.py

      - name: AppTest - save and reopen a day
        run: python scripts/check_day_save_load.py

      - name: AppTest - label photo fills the form
        run: python scripts/check_label_photo_fill.py

      - name: AppTest - export sheet dedupe
        run: python scripts/check_export_sheets.py

      # --- Lint: BLOCKING since 2026-07-30 ----------------------------
      # These carried continue-on-error while ~5,600 lines of pre-existing
      # code had never been formatted -- failing CI on day one for old
      # style would have been noise, not signal. The black reformat landed
      # in 3fc28d9 and the remaining ruff findings were fixed or configured
      # away in pyproject.toml, so the flag is gone and lint now gates.

      - name: Run ruff check
        run: ruff check .

      - name: Run black --check
        run: black --check .

  # No deploy job here on purpose: Streamlit Community Cloud already
  # auto-deploys from `main` on every push (see CONTEXT.md §3/§11).
