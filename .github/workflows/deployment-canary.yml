name: BTFCalc deployment canary

# WHAT THIS IS FOR
#
# Streamlit Community Cloud puts an idle app to sleep and shows a "this app
# has gone to sleep" page with a "Yes, get this app back up!" button on the
# next visit. Nothing in this repo's CI (ci.yml) or dependency canary
# (canary.yml) ever visits the *deployed* URL, so a sleeping app can sit
# unnoticed until a real user hits it. This workflow visits
# https://btfcalc.streamlit.app every eight hours, wakes it up if asleep,
# and fails loudly unless the real app interface loads.
#
# WHY EVERY EIGHT HOURS. Streamlit hibernates an app after roughly twelve
# hours without traffic, so three visits a day keep the app warm at all
# times, including before the morning workday. This file used to visit once
# a day at 6am America/Toronto, which needed two UTC cron lines and a guard
# step to survive DST -- and still left a 24-hour gap in which the app could
# sleep. A uniform cadence has no local time to chase, so the guard is gone.
#
# Named "deployment canary" (not "canary") deliberately: canary.yml already
# owns that name for an unrelated dependency-upgrade check.
#
# There is deliberately no checkout. This workflow never needs repository
# files, so it cannot modify application code even by accident.
#
# Keep in sync with its twin in ENCalc (inpatient_feeds_calculator).

"on":
  workflow_dispatch:
  schedule:
    # Every eight hours. GitHub's schedule cron is always UTC.
    - cron: "45 5,13,21 * * *"

permissions:
  contents: read

concurrency:
  # Two overlapping runs could both click "wake up" at once. Queue instead.
  group: btfcalc-deployment-canary
  cancel-in-progress: false

env:
  APP_URL: https://btfcalc.streamlit.app

jobs:
  wake-and-check:
    name: Wake BTFCalc and confirm it loads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Write the wake-and-check script
        run: |
          cat <<'EOF' > wake_check.js
          const { chromium } = require("playwright");

          const APP_URL = process.env.APP_URL;
          const NAV_TIMEOUT_MS = 60_000;
          const APP_READY_TIMEOUT_MS = 5 * 60_000; // cold starts are slow
          const POLL_INTERVAL_MS = 2_000;

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              console.log(`Opening ${APP_URL} ...`);
              await page.goto(APP_URL, {
                timeout: NAV_TIMEOUT_MS,
                waitUntil: "domcontentloaded",
              });

              // Streamlit also adds a separate, hidden status iframe. Target
              // the deployed app's frame explicitly, rather than asking
              // Playwright to choose between the two.
              const appFrame = page.frameLocator('iframe[title="streamlitApp"]');
              const wakeButtons = [
                page.getByRole("button", { name: /Yes, get this app back up!/i }),
                appFrame.getByRole("button", { name: /Yes, get this app back up!/i }),
              ];
              // Proof the REAL app loaded, not just Streamlit's shell: the
              // app's own first tab, from app/streamlit_app.py. If the tabs
              // are ever renamed, update this name to match.
              const readyLocators = [
                page.getByRole("tab", { name: "Nutrition targets" }),
                appFrame.getByRole("tab", { name: "Nutrition targets" }),
              ];
              const firstVisible = async (locators) => {
                for (const locator of locators) {
                  if (await locator.isVisible()) {
                    return locator;
                  }
                }
                return null;
              };
              const deadline = Date.now() + APP_READY_TIMEOUT_MS;
              let wakeRequested = false;

              console.log("Waiting for Streamlit to show the wake-up button or the app...");

              while (Date.now() < deadline) {
                if (await firstVisible(readyLocators)) {
                  console.log(
                    wakeRequested
                      ? "App loaded successfully after wake-up."
                      : "App already awake; no wake-up action was needed."
                  );
                  return;
                }

                const wakeButton = await firstVisible(wakeButtons);
                if (!wakeRequested && wakeButton) {
                  console.log("App is asleep. Clicking the wake-up button.");
                  await wakeButton.click();
                  wakeRequested = true;
                }

                await page.waitForTimeout(POLL_INTERVAL_MS);
              }

              throw new Error(
                wakeRequested
                  ? "The wake-up button was clicked, but the app did not finish loading."
                  : "Neither the wake-up button nor the loaded app appeared."
              );
            } catch (err) {
              console.error("BTFCalc deployment canary FAILED:", err);
              try {
                await page.screenshot({ path: "canary-failure.png", fullPage: true });
              } catch (screenshotErr) {
                console.error("Could not capture a failure screenshot:", screenshotErr);
              }
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run the wake-and-check script
        run: node wake_check.js

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: canary-failure-screenshot
          path: canary-failure.png
          retention-days: 14
